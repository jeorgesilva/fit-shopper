<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fit Shopper - Exemplo</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-11423608709"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-11423608709');
  </script>
  <style>
    /* Minimal styles para o exemplo */
    :root{--accent:#0b74da}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;color:#222}
    header{background:var(--accent);color:#fff;padding:1rem;text-align:center}
    .hero{display:flex;align-items:center;justify-content:center;padding:0;margin:0}
    .hero svg{width:100%;height:auto;display:block}
    .hero-cta{position:absolute;left:50%;top:55%;transform:translateX(-50%);}
    .btn{display:inline-block;background:#ff6a00;color:#fff;padding:.9rem 1.6rem;border-radius:10px;text-decoration:none;font-weight:700}
    .container{position:relative;max-width:1200px;margin:0 auto}
    footer{font-size:.9rem;text-align:center;padding:1rem;background:#f5f5f5}
    @media(min-width:600px){.hero-cta{top:60%}}
  </style>
</head>
<body>
  <header>
    <h1>Fit Shopper — Exemplo</h1>
  </header>
  <main class="hero">
    <div class="container">
      <!-- SVG hero -->
      <svg role="img" aria-label="Instadoodle hero image" src="Instadoodle.svg">
        <image href="Instadoodle.svg" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" />
      </svg>

      <div class="hero-cta">
        <a id="cta-button" class="btn" href="https://seu-link-afiliado.com" target="_blank" rel="noopener noreferrer">Quero começar</a>
      </div>
    </div>
  </main>

  <script>
    // Enviar evento de conversão ao clicar no CTA (se gtag estiver disponível)
    document.getElementById('cta-button').addEventListener('click', function(){
      if(window.gtag){
        gtag('event', 'conversion', { 'send_to': 'AW-11423608709/label' });
      }
    });
  </script>
  <footer>
    © Fit Shopper - Exemplo
  </footer>
</body>
</html>
