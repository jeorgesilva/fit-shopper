<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>InstaDoodle - Whiteboard Animation</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-11423608709"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);} 
    gtag('js', new Date());
    gtag('config', 'AW-11423608709');
  </script>
</head>
<body>
  <main class="container">
    <section class="hero">
      <div class="hero-content">
    
    <!-- Coluna Esquerda: Mockup (external image) -->
    <div class="hero-left">
      <div class="shape-bg"></div>
      <div class="media-stage">
        <picture>
          <source srcset="box1.webp" type="image/webp">
          <!-- fallback for browsers that don't support WebP; placeholder ensures visibility if local asset missing -->
          <img src="box1.webp" alt="Box InstaDoodle" class="mockup" data-fallback="https://via.placeholder.com/600x400?text=InstaDoodle" data-href="https://d3f7c-hd7hwkyge5po07nfv0yf.hop.clickbank.net">
        </picture>
        <button class="play-overlay" aria-label="Play video" title="Play video"></button>
      </div>
    </div>
    
    <!-- Coluna Direita: Texto e CTA -->
    <div class="hero-right">
          <div class="logo-wrap">
            <img src="assets/logo-doodle.webp" alt="InstaDoodle Logo" data-fallback="logo.png" data-href="https://d3f7c-hd7hwkyge5po07nfv0yf.hop.clickbank.net">
          </div>
          <h1 data-href="https://d3f7c-hd7hwkyge5po07nfv0yf.hop.clickbank.net">VIDEOS IN 3 CLICKS</h1>
          <p data-href="https://d3f7c-hd7hwkyge5po07nfv0yf.hop.clickbank.net">AI Text To Video .<br>No More Expensive Freelancers.</p>
          <button type="button" class="cta-btn pulse" data-href="https://d3f7c-hd7hwkyge5po07nfv0yf.hop.clickbank.net">
            GET InstaDoodle NOW!
          </button>
    </div>
    
  </div>
</section>
  </main>

    <script>
        function trackerAndRedirect(e){
          if(e && e.preventDefault) e.preventDefault();
          // Prefer data-href for programmatic redirects (safer); fall back to href
          var el = e && e.currentTarget ? e.currentTarget : this;
          var url = (el && el.getAttribute && (el.getAttribute('data-href') || el.getAttribute('href'))) || '#';

          // Try to send a beacon to a lightweight affiliate endpoint if available
          try {
            var beaconUrl = 'https://www.googletagmanager.com/collect?v=1&tid=AW-11423608709&cid=client_id&t=event&ec=affiliate&ea=click_afiliado';
            if (navigator.sendBeacon) {
              try { navigator.sendBeacon(beaconUrl); } catch(beaconErr) { /* ignore */ }
            }
          } catch(err) { /* ignore */ }

          // Use gtag with event_callback to reliably redirect after analytics fires
          var redirected = false;
          var doRedirect = function(){ if(!redirected){ redirected = true; window.location = url; } };

          try {
            gtag('event', 'click_afiliado', {
              'send_to': 'AW-11423608709',
              'event_callback': doRedirect
            });
          } catch(err) {
            // If gtag fails, still redirect after a short delay
            setTimeout(doRedirect, 300);
          }

          // Safety fallback: ensure we always redirect after 1200ms
          setTimeout(doRedirect, 1200);

          return false;
        }

      document.addEventListener('DOMContentLoaded', function(){
        // Bind trackerAndRedirect to any element with data-href (clickable/logo/text/mockup)
        var clickables = document.querySelectorAll('[data-href]');
        clickables.forEach(function(el){
          // mouse click
          el.addEventListener('click', trackerAndRedirect);
          // keyboard activation for non-button elements (Enter / Space)
          el.addEventListener('keydown', function(e){
            if(e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              trackerAndRedirect.call(el, e);
            }
          });
          // make non-interactive elements focusable for keyboard users
          if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');
          // ensure pointer cursor
          el.style.cursor = 'pointer';
        });
      });
      
      // Centralized image fallback handling: use data-fallback instead of inline onerror
      (function(){
        function applyFallback(img){
          var fb = img.getAttribute('data-fallback');
          if(!fb) return;
          img.addEventListener('error', function handler(){
            img.removeEventListener('error', handler);
            img.src = fb;
          });
        }
        document.querySelectorAll('img[data-fallback]').forEach(applyFallback);
      })();

      // Video swap: click play -> fade out mockup, insert autoplay muted Vimeo iframe
      (function(){
        function initMediaStage(){
          var stage = document.querySelector('.media-stage');
          if(!stage) return;
          var img = stage.querySelector('.mockup');
          var play = stage.querySelector('.play-overlay');
          var vimeoSrc = 'https://player.vimeo.com/video/965207353?autoplay=1&muted=1&playsinline=1';

          play.addEventListener('click', function(ev){
            ev.stopPropagation();
            ev.preventDefault();
            // avoid triggering affiliate redirect if image had data-href
            // remove data-href from the image specifically (closest ancestor may not exist)
            try { img.removeAttribute('data-href'); } catch(e){}

            // remove the play overlay so it doesn't remain on top of the iframe
            try { play.parentNode && play.parentNode.removeChild(play); } catch(e){}

            // fade out image (keep it in DOM as visual fallback until iframe is ready)
            img.classList.add('hidden');
            img.setAttribute('aria-hidden', 'true');

            // create iframe (force eager loading on mobile so autoplay can start)
            var iframe = document.createElement('iframe');
            iframe.setAttribute('src', vimeoSrc);
            iframe.setAttribute('frameborder', '0');
            iframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture; encrypted-media');
            // don't lazy-load on mobile interaction: use eager
            iframe.setAttribute('loading', 'eager');
            iframe.style.width = '100%';
            iframe.style.height = '100%';

            // append and wait a tick to trigger transition
            stage.appendChild(iframe);
            requestAnimationFrame(function(){
              iframe.classList.add('ready');
            });

            // If autoplay is blocked, fallback: open Vimeo in new tab after short timeout
            setTimeout(function(){
              // if iframe didn't get visible (opacity), open direct link as user's click fallback
              if(!iframe.classList.contains('ready')) return;
              // nothing else to check cross-origin, but user can tap again to open if needed
            }, 800);
          });
        }
        document.addEventListener('DOMContentLoaded', initMediaStage);
      })();
    </script>
  </body>
</html>

<style>
/* Remove contorno/borda e sombra da imagem box1 / mockup */
.hero-left .mockup,
.hero-visuals .box1,
.box1 {
  border: none !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  outline: none !important;
}

:root {
  --cta-start: #E91E63; /* rosa */
  --cta-end:   #9C27B0; /* roxo */
}

.cta-btn {
  background: linear-gradient(90deg, var(--cta-start), var(--cta-end));
  color: #fff;
  border: none;
  padding: 14px 36px;
  border-radius: 12px;
  box-shadow: 0 10px 24px rgba(233,30,99,0.18);
  transition: transform .18s ease, box-shadow .18s ease;
}
.cta-btn:hover { transform: translateY(-2px); filter: saturate(1.05); }
.cta-btn:active { transform: translateY(1px); box-shadow: 0 6px 14px rgba(0,0,0,0.28); }
.cta-btn:focus-visible {
  outline: 3px solid rgba(156,39,176,0.22);
  outline-offset: 4px;
}

/* Centrar os itens dentro da coluna direita (apenas dentro do container) */
.hero-right {
  display: flex;
  flex-direction: column;   /* empilha verticalmente */
  align-items: center;      /* centraliza horizontalmente os filhos dentro da coluna */
  justify-content: center;  /* (opcional) centra verticalmente dentro da coluna */
  text-align: center;       /* centraliza linhas de texto (h1, p) */
  gap: 18px;                /* espaçamento entre itens */
}

/* Garantir que imagens e botão fiquem realmente centralizados */
.logo-wrap img {
  display: block;
  margin: 0 auto;
}

.cta-btn {
  display: inline-block; /* mantém tamanho do conteúdo */
  margin: 0 auto;        /* centraliza horizontalmente */
}

/* Pulse animation for CTA button (subtle, accessible) */
@keyframes cta-pulse {
  0% { transform: translateY(0) scale(1); box-shadow: 0 10px 24px rgba(233,30,99,0.18); }
  50% { transform: translateY(-3px) scale(1.03); box-shadow: 0 16px 36px rgba(233,30,99,0.22); }
  100% { transform: translateY(0) scale(1); box-shadow: 0 10px 24px rgba(233,30,99,0.18); }
}

.cta-btn.pulse {
  animation: cta-pulse 2.2s ease-in-out infinite;
  will-change: transform, box-shadow;
}

/* Pause pulse on hover or focus so it doesn't distract while interacting */
.cta-btn.pulse:hover,
.cta-btn.pulse:focus {
  animation-play-state: paused;
}

/* Respect users who prefer reduced motion */
@media (prefers-reduced-motion: reduce) {
  .cta-btn.pulse { animation: none; }
}

@media (min-width: 900px) {
  .hero-right {
    /* keep items centered in the right column on desktop as requested */
    align-items: center;
    text-align: center;
  }
  .cta-btn { margin: 0 auto; } /* keep CTA centered within its column */
}

/* Media stage: mockup -> video swap */
.media-stage { position: relative; display: inline-block; width: 100%; max-width: var(--mockup-max, 780px); /* preserve aspect ratio of media via padding */ }
.media-stage::before { content: ''; display:block; padding-top:56.25%; /* 16:9 aspect ratio */ }
.media-stage .mockup { position: absolute; inset: 0; width: 100%; height: 100%; object-fit:cover; transition: opacity 450ms ease; }
.media-stage .mockup.hidden { opacity: 0; pointer-events: none; }
.media-stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 450ms ease; border: 0; }
.media-stage iframe.ready { opacity: 1; }
.play-overlay {
  position: absolute;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 88px; height: 88px; border-radius: 50%;
  background: rgba(0,0,0,0.55) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><polygon points="18,12 54,32 18,52" fill="%23fff"/></svg>') center/40% no-repeat;
  border: none; cursor: pointer; z-index: 4;
}
.play-overlay:focus { outline: 3px solid rgba(156,39,176,0.22); }

@media (max-width: 600px) {
  .play-overlay { width: 60px; height: 60px; background-size: 28% !important; }
}
