<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fit Shopper - Exemplo</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-11423608709"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-11423608709');
  </script>
  <style>
    /* Fullscreen hero, fundo preto, sem scroll */
    :root{--accent:#0b74da}
    html,body{height:100%;margin:0}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#000;color:#fff;overflow:hidden}
    /* Hero cobre toda a viewport */
    .hero{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
    .hero img{width:100vw;height:100vh;object-fit:cover;display:block}
    .hero-cta{position:absolute;left:50%;top:65%;transform:translate(-50%,-50%);z-index:30}
    .btn{display:inline-block;background:#ff6a00;color:#fff;padding:.9rem 1.6rem;border-radius:10px;text-decoration:none;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.4)}
    /* ocultar elementos auxiliares fora do hero */
    header, footer{display:none}
    @media(min-width:600px){.hero-cta{top:60%}}
  </style>
</head>
<body>
  <main class="hero">
    <!-- Hero full-viewport usando o SVG como image -->
    <img src="Instadoodle.svg" alt="Instadoodle hero image">

    <div class="hero-cta">
      <a id="cta-button" class="btn" href="https://seu-link-afiliado.com" target="_blank" rel="noopener noreferrer">Quero começar</a>
    </div>
  </main>

  <script>
    // Enviar evento de conversão ao clicar no CTA (se gtag estiver disponível)
    document.getElementById('cta-button').addEventListener('click', function(){
      if(window.gtag){
        gtag('event', 'conversion', { 'send_to': 'AW-11423608709/label' });
      }
    });
  </script>
  
</body>
</html>
