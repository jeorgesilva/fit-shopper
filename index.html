<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>InstaDoodle - Whiteboard Animation</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-11423608709"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);} 
    gtag('js', new Date());
    gtag('config', 'AW-11423608709');
  </script>
</head>
<body>
  <main class="container">
  <section class="instadoodle-hero hero">
  <div class="hero-content">
    
    <!-- Coluna Esquerda: Mockup (external image) -->
    <div class="hero-left">
      <div class="shape-bg"></div>
      <img src="https://instadoodle.com/images/box1.webp" alt="Box InstaDoodle" class="mockup" onerror="this.onerror=null;this.src='https://via.placeholder.com/600x400?text=InstaDoodle'">
    </div>
    
    <!-- Coluna Direita: Texto e CTA -->
    <div class="hero-right">
      <div class="logo-wrap">
  <img src="assets/logo-doodle.webp" alt="InstaDoodle Logo" onerror="this.onerror=null;this.src='logo.png'">
      </div>
      <h1>WHITEBOARD ANIMATION</h1>
      <p>Videos in Just 3 Clicks.<br>No More Expensive Freelancers.</p>
      <a href="#" class="cta-btn">GET InstaDoodle NOW!</a>
    </div>
    
  </div>
</section>
    </main>

    <script>
        function trackerAndRedirect(e){
          if(e && e.preventDefault) e.preventDefault();
          var url = e.currentTarget.getAttribute('href') || '#';

          // Try to send a beacon to a lightweight affiliate endpoint if available
          try {
            var beaconUrl = 'https://www.googletagmanager.com/collect?v=1&tid=AW-11423608709&cid=client_id&t=event&ec=affiliate&ea=click_afiliado';
            if (navigator.sendBeacon) {
              try { navigator.sendBeacon(beaconUrl); } catch(beaconErr) { /* ignore */ }
            }
          } catch(err) { /* ignore */ }

          // Use gtag with event_callback to reliably redirect after analytics fires
          var redirected = false;
          var doRedirect = function(){ if(!redirected){ redirected = true; window.location = url; } };

          try {
            gtag('event', 'click_afiliado', {
              'send_to': 'AW-11423608709',
              'event_callback': doRedirect
            });
          } catch(err) {
            // If gtag fails, still redirect after a short delay
            setTimeout(doRedirect, 300);
          }

          // Safety fallback: ensure we always redirect after 1200ms
          setTimeout(doRedirect, 1200);

          return false;
        }

      document.addEventListener('DOMContentLoaded', function(){
        var cta = document.querySelector('.cta-btn');
        if(cta) cta.addEventListener('click', trackerAndRedirect);
        // Enforce side-by-side layout on desktop as a fallback (applied via JS)
        function applyDesktopLayout(){
          var heroContent = document.querySelector('.hero-content');
          var heroLeft = document.querySelector('.hero-left');
          var heroRight = document.querySelector('.hero-right');
          if(!heroContent || !heroLeft || !heroRight) return;
          if(window.innerWidth >= 900){
            heroContent.style.display = 'flex';
            heroContent.style.flexDirection = 'row';
            heroContent.style.flexWrap = 'nowrap';
            heroLeft.style.flex = '0 0 55%';
            heroLeft.style.maxWidth = '55%';
            heroRight.style.flex = '0 0 45%';
            heroRight.style.maxWidth = '45%';
            heroLeft.style.display = 'flex';
            heroLeft.style.alignItems = 'center';
            heroRight.style.display = 'flex';
            heroRight.style.flexDirection = 'column';
            heroRight.style.justifyContent = 'center';
            heroRight.style.textAlign = 'center';
          } else {
            // remove inline styles so mobile stack works naturally
            heroContent.style.display = '';
            heroContent.style.flexDirection = '';
            heroContent.style.flexWrap = '';
            heroLeft.style.flex = '';
            heroLeft.style.maxWidth = '';
            heroRight.style.flex = '';
            heroRight.style.maxWidth = '';
            heroLeft.style.display = '';
            heroLeft.style.alignItems = '';
            heroRight.style.display = '';
            heroRight.style.flexDirection = '';
            heroRight.style.justifyContent = '';
            heroRight.style.textAlign = '';
          }
        }
        applyDesktopLayout();
        window.addEventListener('resize', function(){ applyDesktopLayout(); });
      });
    </script>
  </body>
</html>
