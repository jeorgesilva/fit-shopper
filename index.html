<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>InstaDoodle - Whiteboard Animation</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-11423608709"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);} 
    gtag('js', new Date());
    gtag('config', 'AW-11423608709');
  </script>
</head>
<body>
  <main class="container">
    <section class="hero">
  <div class="hero-content">
    
    <!-- Coluna Esquerda: Mockup (external image) -->
    <div class="hero-left">
      <div class="shape-bg"></div>
      <img src="https://instadoodle.com/images/box1.webp" alt="Box InstaDoodle" class="mockup" onerror="this.onerror=null;this.src='https://via.placeholder.com/600x400?text=InstaDoodle'">
    </div>
    
    <!-- Coluna Direita: Texto e CTA -->
    <div class="hero-right">
      <div class="logo-wrap">
        <img src="logo.png" alt="InstaDoodle Logo">
      </div>
      <h1>WHITEBOARD ANIMATION</h1>
      <p>Videos in Just 3 Clicks.<br>No More Expensive Freelancers.</p>
      <a href="#" class="cta-btn">GET InstaDoodle NOW!</a>
    </div>
    
  </div>
</section>
    </main>

    <script>
      function trackerAndRedirect(e){
        if(e && e.preventDefault) e.preventDefault();
        var url = e.currentTarget.getAttribute('href');
        // Fire conversion event with custom name 'click_afiliado'
        try{ gtag('event', 'click_afiliado', { 'send_to': 'AW-11423608709' }); } catch(err){}
        // small delay then redirect
        setTimeout(function(){ window.location = url; }, 250);
        return false;
      }

      document.addEventListener('DOMContentLoaded', function(){
        var cta = document.querySelector('.cta-btn');
        if(cta) cta.addEventListener('click', trackerAndRedirect);
      });
    </script>
  </body>
</html>
