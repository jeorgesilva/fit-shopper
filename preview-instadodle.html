<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Preview InstaDoodle Hero</title>
  <style>
  /* Reset básico */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; background: #000; color: #fff; }
  /* Seção principal */
  .hero { width: 100%; padding: 80px 5%; display: flex; justify-content: center; }
  .hero-content { display: flex; align-items: center; justify-content: space-between; max-width: 1200px; width: 100%; }
  /* Coluna esquerda */
  .hero-left { position: relative; flex: 1; }
  .shape-bg { position: absolute; width: 350px; height: 350px; background: linear-gradient(135deg, #a64ce5, #ff5fa2); border-radius: 50% 40% 60% 50% / 50% 60% 40% 50%; top: -50px; left: -50px; z-index: 0; }
  .mockup { width: 300px; position: relative; z-index: 2; }
  .box { width: 180px; position: absolute; left: 200px; top: 50px; z-index: 3; }
  /* Coluna direita */
  .hero-right { flex: 1; padding-left: 50px; }
  .logo-wrap img { background: #fff; border-radius: 40px; padding: 10px 20px; display: inline-block; margin-bottom: 20px; max-width: 200px; }
  .hero-right h1 { font-size: 2.5rem; font-weight: 900; margin-bottom: 20px; }
  .hero-right p { font-size: 1.2rem; margin-bottom: 30px; line-height: 1.5; }
  .cta-btn { display: inline-block; padding: 15px 40px; font-weight: bold; font-size: 1.1rem; text-decoration: none; color: #fff; background: linear-gradient(90deg, #ff5fa2, #5fc9ff); border-radius: 5px; transition: transform 0.2s ease; }
  .cta-btn:hover { transform: scale(1.05); }
  @media (max-width: 900px) { .hero-content { flex-direction: column; } .hero-left, .hero-right { width: 100%; padding: 10px 0; } .shape-bg { display: none; } .mockup { width: 220px; margin: 0 auto; display: block; } .box { position: relative; left: auto; top: -30px; margin: 0 auto; display: block; } .hero-right { padding-left: 0; text-align: center; } }
  /* small helpers for preview */
  .preview-wrap { min-height: 100vh; display:flex; align-items:center; justify-content:center; }
  </style>
</head>
<body>
  <div class="preview-wrap">
    <section class="hero">
      <div class="hero-content">
        <div class="hero-left">
          <div class="shape-bg"></div>
          <picture>
            <source srcset="box1.webp" type="image/webp">
            <img class="mockup" src="box1.webp" alt="Box InstaDoodle" style="position:relative;z-index:2;width:100%;max-width:600px;height:338px;border-radius:12px;" />
          </picture>
        </div>
        <div class="hero-right">
          <div class="logo-wrap">
            <img src="html5up-paradigm-shift/images/logo-instadoodle.png" alt="InstaDoodle Logo" data-fallback="https://via.placeholder.com/220x80?text=Logo">
          </div>
          <h1>WHITEBOARD ANIMATION</h1>
          <p>Videos in Just 3 Clicks.<br>No More Expensive Freelancers.</p>
          <a href="#" class="cta-btn">GET InstaDoodle NOW!</a>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
